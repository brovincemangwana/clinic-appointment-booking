<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediBook Admin – Doctors</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body class="admin">
  <aside class="side">
    <a class="logo" href="index.html"><span class="mark"></span>MediBook <small>Admin</small></a>
    <nav aria-label="Admin">
      <a href="admin.html">Appointments</a>
      <a class="on" href="admin-doctors.html">Doctors</a>
    </nav>
    <a class="out" href="index.html">Back to site</a>
  </aside>

  <main class="admin-main">
    <header class="admin-head"><h1>Doctors</h1></header>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="two-col">
      <div class="card table-card">
        <table>
          <thead>
            <tr>
              <th scope="col">Doctor</th>
              <th scope="col">Specialty</th>
              <th scope="col">Days</th>
              <th scope="col">Hours</th>
              <th scope="col">Slot (min)</th>
              <th scope="col">Status</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <form id="doctor-form" class="card form" novalidate>
        <h2 id="form-title">Add doctor</h2>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" autocomplete="off" placeholder="e.g. Dr. Jane Mwangi">
          <p id="name-error" class="error-text"></p>
        </div>
        <div class="field">
          <label for="specialty">Specialty</label>
          <input id="specialty" list="specialties" autocomplete="off" placeholder="e.g. Pediatrician">
          <datalist id="specialties"></datalist>
          <p id="specialty-error" class="error-text"></p>
        </div>
        <fieldset class="field">
          <legend>Working days</legend>
          <div id="days" class="days-pick"></div>
          <p id="days-error" class="error-text"></p>
        </fieldset>
        <div class="time-row">
          <div class="field">
            <label for="start">Start time</label>
            <input id="start" type="time">
          </div>
          <div class="field">
            <label for="end">End time</label>
            <input id="end" type="time">
          </div>
        </div>
        <p id="time-error" class="error-text"></p>
        <div class="field">
          <label for="slot">Slot length</label>
          <select id="slot"></select>
          <p id="slot-error" class="error-text"></p>
        </div>
        <label class="check"><input id="available" type="checkbox" checked> Accepting appointments</label>
        <div class="btns">
          <button class="btn primary" type="submit" id="save">Save doctor</button>
          <button class="btn" type="button" id="cancel-edit">Cancel</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
