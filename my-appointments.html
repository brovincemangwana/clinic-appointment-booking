<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediBook – My appointments</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="index.html"><span class="mark"></span>MediBook</a>
    <nav aria-label="Main">
      <a href="index.html">Doctors</a>
      <a class="on" href="my-appointments.html">My appointments</a>
      <a href="staff-login.html">Staff login</a>
    </nav>
  </header>

  <main class="lookup">
    <h1>My appointments</h1>
    <p class="muted">Enter the phone number you booked with to view, reschedule or cancel.</p>

    <form id="lookup-form" class="card lookup-form" novalidate>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" autocomplete="tel" placeholder="e.g. 0712 345 678">
        <p id="phone-error" class="error-text"></p>
      </div>
      <button class="btn primary" type="submit">Find appointments</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="results" class="results"></div>
  </main>
    <dialog id="reschedule-dialog" class="dialog" aria-labelledby="rs-title">
    <form id="reschedule-form" class="dialog-body" novalidate>
      <h2 id="rs-title">Reschedule appointment</h2>
      <p id="rs-doctor" class="muted"></p>
      <h3>Pick a new date</h3>
      <div id="rs-dates" class="dates"></div>
      <h3>Pick a new time</h3>
      <div id="rs-slots" class="slots"></div>
      <p id="rs-error" class="error-text" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="rs-close">Keep current time</button>
        <button class="btn primary" type="submit" id="rs-save">Save new time</button>
      </div>
    </form>
  </dialog>
    <script type="module" src="src/js/my-appointments.js"></script>
</body>
</html>
