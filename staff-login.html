<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediBook – Staff login</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="index.html"><span class="mark"></span>MediBook</a>
    <nav aria-label="Main">
      <a href="index.html">Doctors</a>
      <a href="my-appointments.html">My appointments</a>
      <a class="on" href="staff-login.html">Staff login</a>
    </nav>
  </header>

  <main class="lookup">
    <h1>Staff login</h1>
    <p class="muted">Enter the staff password to manage appointments and doctors.</p>

    <form id="login-form" class="card lookup-form" novalidate>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <p id="password-error" class="error-text"></p>
      </div>
      <button class="btn primary" type="submit" id="login-button">Log in</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="src/js/staff-login.js"></script>
</body>
</html>
